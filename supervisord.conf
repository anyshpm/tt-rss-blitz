[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; The upstream startup script initializes /var/www/html/tt-rss, performs
; database/schema setup, then execs PHP-FPM in the foreground.
[program:php-fpm]
command=/bin/sh -c "/opt/tt-rss/startup.sh"
priority=10
autostart=true
autorestart=unexpected
startsecs=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; The official updater waits for app initialization, then starts update_daemon2.
[program:updater]
command=/bin/sh -c "/opt/tt-rss/updater.sh"
priority=20
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Start Nginx only after PHP-FPM accepts FastCGI connections.
[program:nginx]
command=/usr/local/bin/start-nginx.sh
priority=30
autostart=true
autorestart=unexpected
startsecs=3
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
