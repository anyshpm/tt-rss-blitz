server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    listen 80;
    listen [::]:80;
    server_name _;

    # Matches the upstream TT-RSS Docker layout:
    # /var/www/html/index.php is the entry point and the app lives in
    # /var/www/html/tt-rss.
    root /var/www/html;
    index index.php;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 32m;
    sendfile on;

    location = /tt-rss/healthz {
        rewrite ^ /tt-rss/public.php?op=healthcheck last;
    }

    location /tt-rss/cache {
        internal;
    }

    location /tt-rss/backups {
        internal;
    }

    # Support PATH_INFO used by some local plugins, as in the upstream config.
    location ~ /plugins\.local/.*/api/.*\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        set $path_info $fastcgi_path_info;
        fastcgi_param PATH_INFO $path_info;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
