# Local test only. For blitz.cloud, build/publish this Dockerfile as one image
# and configure the app's kept folder /var/www/html.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TTRSS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TTRSS_DB_PASS:?Set TTRSS_DB_PASS in .env}
      POSTGRES_DB: ${TTRSS_DB_NAME:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ttrss:
    build:
      context: .
      args:
        TTRSS_IMAGE: ${TTRSS_IMAGE:-ghcr.io/tt-rss/tt-rss:latest}
    image: tt-rss-blitz:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TTRSS_DB_HOST: db
      TTRSS_DB_PORT: 5432
      TTRSS_DB_NAME: ${TTRSS_DB_NAME:-postgres}
      TTRSS_DB_USER: ${TTRSS_DB_USER:-postgres}
      TTRSS_DB_PASS: ${TTRSS_DB_PASS}
      TTRSS_SELF_URL_PATH: ${TTRSS_SELF_URL_PATH:-http://localhost:8080/tt-rss}
      ADMIN_USER_PASS: ${ADMIN_USER_PASS:-}
      TTRSS_PLUGINS: ${TTRSS_PLUGINS:-auth_internal, note, nginx_xaccel}
    ports:
      - "8080:8080"
    volumes:
      - ttrss_files:/var/www/html

volumes:
  db_data:
  ttrss_files:
